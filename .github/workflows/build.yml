name: Build Docker Image

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # ✅ Free up disk space FIRST — models are ~10GB, default runner has ~14GB
      # Without this the build fails with "no space left on device"
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android
          docker system prune -af
          df -h

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ✅ Single build step — removed the duplicate, added HF_TOKEN build arg
      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: ./runpod
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/catvton-runpod:latest
          build-args: |
            HF_TOKEN=${{ secrets.HF_TOKEN }}